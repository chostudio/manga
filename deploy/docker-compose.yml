# Full microservices stack: Postgres + ml (Python) + api & ingestion (Spring Boot).
# From the repo root:  docker compose -f deploy/docker-compose.yml up --build
#
# Note: the `ml` image bundles torch/onnxruntime and is multi-GB — the first
# build is slow. Model weights download on first inference; the hf-cache volume
# keeps them across restarts.
services:
  db:
    image: pgvector/pgvector:pg16
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: manga
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

  ml:
    build: ../services/ml
    restart: always
    environment:
      WD_TAGGER_MODEL: EVA02_Large
      WD_TAG_THRESHOLD: "0.30"
    ports:
      - "8001:8001"
    volumes:
      - hf_cache:/srv/.cache/huggingface

  api:
    build: ../services/api
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_JDBC_URL: jdbc:postgresql://db:5432/manga
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      ML_BASE_URL: http://ml:8001
    ports:
      - "8080:8080"

  ingestion:
    build: ../services/ingestion
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_JDBC_URL: jdbc:postgresql://db:5432/manga
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      ML_BASE_URL: http://ml:8001
      MANGA_STORAGE_LOCAL_DIR: /srv/media
    ports:
      - "8090:8090"
    volumes:
      - media:/srv/media

volumes:
  postgres_data:
  hf_cache:
  media:
